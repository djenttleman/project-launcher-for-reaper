  .empty-bk{padding:10px 12px;font:var(--rk-meta);color:var(--rk-text-3)}

/* ============ modo slim ============ */
.slim{display:none}
body.is-slim{display:block;background:var(--rk-bg-1)}
body.is-slim .window{display:none}
body.is-slim .slim{display:flex;flex-direction:column;width:100vw;height:100vh;background:var(--rk-bg-1);color:var(--rk-text-1)}
.slim-head{display:flex;align-items:center;gap:9px;padding:11px 12px 9px;border-bottom:1px solid var(--rk-line-1)}
.slim-brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0;font:800 19px/1 var(--rk-font);letter-spacing:1.5px;color:var(--rk-text-1)}
.slim-brand .mark{width:21px;height:21px;flex:none}
.slim-btn{width:26px;height:26px;flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:7px;color:var(--rk-text-3)}
.slim-btn:hover{background:var(--rk-fill-1);color:var(--rk-text-1)}
.slim-btn svg{width:13px;height:13px}
.slim-list{flex:1;overflow-y:auto;padding:6px 7px 10px}
.slim-label{font:700 9px/1 var(--rk-font);letter-spacing:1.5px;text-transform:uppercase;color:var(--rk-text-3);padding:10px 8px 5px}
.slim-row{display:flex;align-items:center;gap:8px;width:100%;padding:7px 5px 7px 6px;border-radius:8px;text-align:left;cursor:default;outline:none}
.slim-row:hover,.slim-row:focus-visible{background:var(--rk-fill-1)}
.slim-row .slot{position:relative;width:16px;height:16px;flex:none;display:flex;align-items:center;justify-content:center}
.slim-row .dot{width:6px;height:6px;border-radius:50%}
.slim-row .pin{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:none;border:0;padding:0;border-radius:4px;color:var(--rk-text-2);opacity:0}
.slim-row .pin svg{width:12px;height:12px;display:block}
.slim-row:hover .dot,.slim-row:focus-visible .dot{opacity:0}
.slim-row:hover .pin,.slim-row:focus-visible .pin{opacity:1}
.slim-row .pin.is-on{opacity:1;color:var(--rk-green)}
.slim-row:hover .pin.is-on:hover{color:var(--rk-text-1)}
.slim-row .txt{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.slim-row .nm{display:flex;align-items:center;gap:6px;min-width:0}
.slim-row .nmt{font:600 12.5px/1.2 var(--rk-font);color:var(--rk-text-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slim-row .mt{font:400 10.5px/1.2 var(--rk-font);color:var(--rk-text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slim-row .go{flex:none;color:var(--rk-green);opacity:0}
.slim-row .go svg{width:12px;height:12px;display:block}
.slim-row:hover .go,.slim-row:focus-visible .go{opacity:1}
.slim-row .x{flex:none;width:20px;height:20px;display:flex;align-items:center;justify-content:center;background:none;border:0;padding:0;border-radius:5px;color:var(--rk-text-3);opacity:0;margin-left:2px}
.slim-row .x svg{width:10px;height:10px;display:block}
.slim-row:hover .x,.slim-row:focus-visible .x{opacity:1}
.slim-row .x:hover{color:#E8686A}
.slim-foot{display:flex;align-items:center;gap:8px;padding:7px 12px;border-top:1px solid var(--rk-line-1);font:400 10.5px/1 var(--rk-font);color:var(--rk-text-3)}
.slim-foot .sp{flex:1}
.slim-btn--full{color:var(--rk-text-2)}
.slim-led{width:7px;height:7px;border-radius:50%;background:#4A4A4E;flex:none}
.slim-led.on{background:var(--rk-green);box-shadow:0 0 6px var(--rk-green)}

/* =========================================================
   Puente nativo
   ========================================================= */
let seq = 0;
const pendingMap = new Map();
function native(cmd, extra) {
  return new Promise(resolve => {
    const id = ++seq;
    // Red de seguridad: si el puente no contesta, no dejar la promesa colgada
    // (antes, un `await native(...)` sin respuesta congelaba el resto del handler).
    const t = setTimeout(() => {
      if (pendingMap.has(id)) { pendingMap.delete(id); resolve({timeout: true}); }
    }, 4000);
    pendingMap.set(id, payload => { clearTimeout(t); resolve(payload); });
    try {
      window.webkit.messageHandlers.sel.postMessage(Object.assign({cmd, id}, extra || {}));
    } catch (e) {
      pendingMap.delete(id); clearTimeout(t); resolve({error: String(e)});
    }
  });
}
window.__native = payload => {
  if (payload && payload._update) {          // refresco silencioso (escaneo en 2º plano)
    DB = payload; renderRail(); return;
  }
  const key = payload && payload._id;
  if (key != null && pendingMap.has(key)) {
    const r = pendingMap.get(key); pendingMap.delete(key); r(payload); return;
  }
  if (payload && payload.projects) { DB = payload; renderAll(); }
};

/* Carpetas y etiquetas por defecto: se guardan como texto plano, pero se
   muestran en el idioma activo. Las que crea el usuario se dejan intactas. */
const FOLDER_ALIASES = {
  'estudio':'Estudio','studio':'Estudio','shows':'Shows','show':'Shows',
  'plantillas':'Plantillas','templates':'Plantillas','laboratorio':'Laboratorio','lab':'Laboratorio'
};
// Carpeta REAL en disco donde vive el .rpp (no la carpeta del launcher).
function realFolder(path){
  const home=(DB.home||'').replace(/\/$/,'');
  let q=String(path||'');
  if(home && q.startsWith(home+'/')) q=q.slice(home.length+1);
  const parts=q.split('/'); parts.pop();
  const cola=parts.slice(-3);
  return (parts.length>3?'…/':'')+cola.join('/');
}

function folderLabel(name){
  if(!name) return name;
  const key = FOLDER_ALIASES[String(name).trim().toLowerCase()];
  return key ? T(key) : name;
}
const TAG_ALIASES = {
  'mezcla':'mezcla','mixing':'mezcla','mix':'mezcla',
  'master':'master','mastering':'master',
  'grabacion':'grabación','recording':'grabación',
  'edicion':'edición','editing':'edición',
  'en-vivo':'en vivo','live':'en vivo','en vivo':'en vivo',
  'plantilla':'plantilla','template':'plantilla'
};
function tagLabel(tag){
  if(!tag) return tag;
  const key = TAG_ALIASES[String(tag).trim().toLowerCase()];
  return key ? T(key) : tag;
}

function T(s, vars){
  let out = (LANG === 'es') ? s : (EN[s] !== undefined ? EN[s] : s);
  if (vars) for (const k in vars) out = out.split('{'+k+'}').join(vars[k]);
  return out;
}
function applyStaticI18n(){
  document.querySelectorAll('[data-en]').forEach(n=>{
    if(n.dataset.es == null) n.dataset.es = n.textContent;
    n.textContent = LANG === 'en' ? n.dataset.en : n.dataset.es;
  });
  document.querySelectorAll('[data-en-ph]').forEach(n=>{
    if(n.dataset.esPh == null) n.dataset.esPh = n.placeholder;
    n.placeholder = LANG === 'en' ? n.dataset.enPh : n.dataset.esPh;
  });
  document.querySelectorAll('[data-en-title]').forEach(n=>{
    if(n.dataset.esTitle == null) n.dataset.esTitle = n.title;
    n.title = LANG === 'en' ? n.dataset.enTitle : n.dataset.esTitle;
  });
  document.querySelectorAll('[data-en-aria]').forEach(n=>{
    if(n.dataset.esAria == null) n.dataset.esAria = n.getAttribute('aria-label');
    n.setAttribute('aria-label', LANG === 'en' ? n.dataset.enAria : n.dataset.esAria);
  });
  const bl = $('#btnLang'); if(bl) bl.textContent = LANG.toUpperCase();
  document.documentElement.lang = LANG;
}
function setLang(lang, persist){
  LANG = (lang === 'en') ? 'en' : 'es';
  document.documentElement.dataset.lang = LANG;
  setPref('lang', LANG);
  if(persist) native('prefs', {theme:getPref('theme','dark'), accent:getPref('accent','reapertips'), lang:LANG});
  applyStaticI18n();
  renderAll();
}


function ago(ts){
  if(!ts) return '—';
  const s = Math.floor((Date.now()/1000)-ts);
  const es = LANG === 'es';
  if(s<3600){ const n=Math.max(1,Math.floor(s/60));  return es ? 'hace '+n+' min' : n+' min ago'; }
  if(s<86400){ const n=Math.floor(s/3600);           return es ? 'hace '+n+' h'   : n+' h ago'; }
  if(s<86400*30){ const n=Math.floor(s/86400);       return es ? 'hace '+n+' d'   : n+' d ago'; }
  const m = Math.floor(s/86400/30);
  return es ? 'hace '+m+(m===1 ? ' mes' : ' meses')
            : m+(m===1 ? ' month ago' : ' months ago');
}
function fmtDate(ts){
  if(!ts) return '—';
  const d=new Date(ts*1000), p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function mb(bytes){ return bytes>0 ? (bytes/1048576).toFixed(1).replace('.', LANG==='es'?',':'.')+' MB' : '—'; }
function hrs(n){ return (n||0).toLocaleString(LANG==='es'?'es-CL':'en-US',{minimumFractionDigits:1,maximumFractionDigits:1})+' h'; }
function icon(path){
  const ns='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(ns,'svg');
  svg.setAttribute('viewBox','0 0 256 256'); svg.setAttribute('fill','currentColor'); svg.setAttribute('class','rk-ico');
  const p=document.createElementNS(ns,'path'); p.setAttribute('d',path); svg.appendChild(p);
  return svg;
}

function visible(p){
  if(state.filter==='archived') return p.archived;
  if(p.archived) return false;
  if(state.filter!=='all' && p.type!==state.filter) return false;
  return true;
}
function qmatch(p){
  if(!state.query) return true;
  const q=state.query.toLowerCase();
  return (p.name+' '+p.path+' '+(p.tags||[]).map(tagLabel).join(' ')+' '+p.folder+' '+folderLabel(p.folder)).toLowerCase().includes(q);
}
function baseList(){
  let arr=DB.projects.filter(visible).filter(qmatch);
  const v=state.view;
  if(v.kind==='recent') arr=arr.filter(p=>!p.hidden).sort((a,b)=>b.lastOpened-a.lastOpened);
  else if(v.kind==='all') arr=arr.slice().sort((a,b)=>a.name.localeCompare(b.name));
  else if(v.kind==='templates') arr=arr.filter(p=>p.type==='template');
  else if(v.kind==='archived') arr=arr.filter(p=>p.archived);
  else if(v.kind==='folder') arr=arr.filter(p=>p.folder===v.value).sort((a,b)=>b.lastOpened-a.lastOpened);
  else if(v.kind==='tag') arr=arr.filter(p=>(p.tags||[]).includes(v.value)).sort((a,b)=>b.lastOpened-a.lastOpened);
  return arr;
}
function orderedList(){
  const arr=baseList();
  return [...arr.filter(p=>p.pinned), ...arr.filter(p=>!p.pinned)];
}
function viewLabel(){
  const v=state.view;
  if(v.kind==='recent') return [T('Recientes'),T('abiertos hace poco')];
  if(v.kind==='all') return [T('Todos los proyectos'),T('biblioteca completa')];
  if(v.kind==='templates') return [T('Plantillas'),T('proyectos base')];
  if(v.kind==='archived') return [T('Archivados'),T('fuera de la lista diaria')];
  if(v.kind==='folder') return [T('Carpeta · {v}',{v:folderLabel(v.value)}),T('agrupación del launcher')];
  return [T('Etiqueta · {v}',{v:tagLabel(v.value)}),T('agrupación del launcher')];
}

function renderTable(){
  const c=$('#content'); c.innerHTML='';
  const arr=orderedList();
  if(!arr.length){
    const e=el('div','rk-empty');
    e.appendChild(el('div','rk-title',T('Sin proyectos en esta vista')));
    e.appendChild(el('div','rk-body',T('Crea un proyecto nuevo o abre un archivo .rpp.')));
    c.appendChild(e); return;
  }
  const wrap=el('div','rk-table-wrap');
  const table=el('table','rk-table');

  // Encabezado sin títulos pero presente: con table-layout:fixed los anchos de
  // columna salen de la primera fila, y la primera fila visible es la banda de
  // grupo (colspan=5), que rompería la alineación. Alto 0 y sin texto.
  const thead=el('thead'); const htr=el('tr');
  [['c-num'],[''],['c-type'],['c-when'],['c-act']].forEach(([cls])=>htr.appendChild(el('th',cls)));
  thead.appendChild(htr); table.appendChild(thead);

  const tbody=el('tbody');
  const pinnedCount=arr.filter(p=>p.pinned).length;
  if(pinnedCount){
    const g=el('tr','rk-tr-group'); const td=el('td',null,T('Fijados')); td.colSpan=5; g.appendChild(td); tbody.appendChild(g);
  }
  arr.forEach((p,idx)=>{
    if(pinnedCount && idx===pinnedCount){
      const g=el('tr','rk-tr-group'); const td=el('td',null,T('Proyectos')); td.colSpan=5; g.appendChild(td); tbody.appendChild(g);
    }
    tbody.appendChild(rowFor(p,idx));
    if(state.expanded.has(p.id) && (p.backups||[]).length) tbody.appendChild(backupsRow(p));
  });
  table.appendChild(tbody); wrap.appendChild(table); c.appendChild(wrap);
}

function rowFor(p,idx){
  const tr=el('tr','project'+(p.id===state.selected?' is-on':''));
  tr.dataset.id=p.id;
  tr.onclick=()=>{state.selected=p.id; renderTable(); renderRail();};
  tr.ondblclick=e=>{ e.altKey ? openWith(p,'fxoffline') : (native('open',{path:p.path}), setTimeout(refresh, 1200)); };

  if(p.exists===false) tr.classList.add('is-missing');

  const tdNum=el('td','c-num');
  const pin=el('button','pin-btn'+(p.pinned?' is-pinned':''));
  const pinTxt = T(p.pinned?'Quitar de fijados':'Fijar proyecto');
  pin.setAttribute('aria-label',pinTxt);
  pin.title=pinTxt;
  pin.appendChild(el('span','num',String(idx+1).padStart(2,'0')));
  const ns='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(ns,'svg');
  svg.setAttribute('viewBox','0 0 256 256'); svg.setAttribute('class','pinico');
  const path=document.createElementNS(ns,'path');
  path.setAttribute('d','M128 24a56 56 0 0 0-56 56c0 30.4 24.8 55.4 48 57.6V200a8 8 0 0 0 16 0v-62.4c23.2-2.2 48-27.2 48-57.6a56 56 0 0 0-56-56Zm0 80a24 24 0 1 1 24-24 24 24 0 0 1-24 24Z');
  svg.appendChild(path); pin.appendChild(svg);
  pin.onclick=e=>{
    e.stopPropagation();
    p.pinned=!p.pinned;
    renderAll();
    native('update',{id:p.id,pinned:p.pinned});
    toast(T(p.pinned?'Fijado arriba':'Quitado de fijados'), ()=>{
      p.pinned=!p.pinned; renderAll(); native('update',{id:p.id,pinned:p.pinned});
      toast(T(p.pinned?'Fijado arriba':'Quitado de fijados'));
    });
  };
  tdNum.appendChild(pin); tr.appendChild(tdNum);

  const tdMain=el('td','rk-td-main');
  const cell=el('div','proj-cell');
  const bks=p.backups||[];
  if(bks.length){
    const exp=el('button','expander');
    exp.setAttribute('aria-expanded', state.expanded.has(p.id)?'true':'false');
    exp.setAttribute('aria-label',T('Ver copias de seguridad'));
    exp.title=T('{n} copias de seguridad',{n:bks.length});
    const chev=document.createElementNS(ns,'svg');
    chev.setAttribute('viewBox','0 0 256 256'); chev.setAttribute('fill','currentColor');
    const cp=document.createElementNS(ns,'path'); cp.setAttribute('d',ICONS.chevron); chev.appendChild(cp);
    exp.appendChild(chev);
    exp.onclick=e=>{e.stopPropagation(); if(state.expanded.has(p.id))state.expanded.delete(p.id); else state.expanded.add(p.id); renderTable();};
    cell.appendChild(exp);
  } else { const pad=el('span'); pad.style.cssText='width:22px;flex:none'; cell.appendChild(pad); }

  const box=el('div','proj-name');
  box.appendChild(el('div','nm',p.name));

  // Etiquetas del proyecto (la carpeta va en su columna).
  if((p.tags||[]).length){
    const loc=el('div','proj-loc');
    const tg=el('span','proj-tags');
    (p.tags||[]).slice(0,4).forEach(t=>tg.appendChild(el('span','proj-tag','#'+tagLabel(t))));
    loc.appendChild(tg);
    box.appendChild(loc);
  }

  if(p.type==='show' && p.regions){
    const st=el('div','proj-strip');
    for(let i=0;i<Math.min(p.regions,16);i++){
      const b=el('i'); b.style.flex=String(1+(i%4)); b.style.background=PAL[i%PAL.length]; st.appendChild(b);
    }
    box.appendChild(st);
  }
  cell.appendChild(box);
  tdMain.appendChild(cell); tr.appendChild(tdMain);

  const tdType=el('td','c-type');
  const badge=el('span','rk-badge rk-badge--plain');
  const fmeta=(DB.folderMeta||{})[p.folder]||{};
  const dot=el('span');
  dot.style.cssText='width:8px;height:8px;border-radius:50%;background:'+(fmeta.color||'var(--rk-text-3)');
  badge.appendChild(dot);
  badge.appendChild(document.createTextNode(p.folder ? folderLabel(p.folder) : T('Sin carpeta')));
  badge.title=T('Carpeta del launcher')+' · '+T('Tipo')+': '+typeLabel(p.type);
  tdType.appendChild(badge); tr.appendChild(tdType);

  const tdWhen=el('td','c-when');
  const w=el('span','rk-meta',ago(p.lastOpened)); w.style.color='var(--rk-text-3)';
  tdWhen.appendChild(w); tr.appendChild(tdWhen);

  const tdAct=el('td','c-act');
  const dots=el('button','rk-btn rk-btn--icon rk-btn--quiet');
  dots.style.cssText='width:28px;height:28px;color:var(--rk-text-3)';
  dots.setAttribute('aria-label',T('Acciones del proyecto'));
  dots.appendChild(icon(ICONS.dots));
  dots.onclick=e=>{e.stopPropagation(); openMenu(p,dots);};
  tdAct.appendChild(dots); tr.appendChild(tdAct);
  return tr;
}

function backupsRow(p){

  td.appendChild(panel); tr.appendChild(td);

    inp.onkeydown=async e=>{
      if(e.key==='Enter' && inp.value.trim()){
        const v=inp.value.trim().toLowerCase().replace(/\s+/g,'-');

function openMenu(p,anchor){
  const m=$('#menu'); m.innerHTML='';
  const mk=(label,fn,cls)=>{const b=el('button','it'+(cls?' '+cls:''),label); b.onclick=async e=>{e.stopPropagation(); closeMenu(); await fn();}; m.appendChild(b);};
  mk(T('Abrir en REAPER'),()=>native('open',{path:p.path}));
  mk(T('Abrir con FX offline (recovery mode)'),()=>openWith(p,'fxoffline'));
  mk(T('Abrir y traer los FX online'),()=>openWith(p,'fxoffline-online'));
  mk(T('Mostrar en Finder'),()=>native('reveal',{path:p.path}));
  if(DB.reaperRunning){ m.appendChild(el('div','sep')); mk(T('Traer todos los FX online'),()=>native('fxonline')); }
  if((p.backups||[]).length) mk(T('Ver copias de seguridad')+' ('+p.backups.length+')',async()=>{ if(state.expanded.has(p.id))state.expanded.delete(p.id); else state.expanded.add(p.id); renderTable(); });
  m.appendChild(el('div','sep'));
  mk(T(p.pinned?'Quitar de fijados':'Fijar arriba'),()=>{
    p.pinned=!p.pinned; renderTable(); renderRail(); native('update',{id:p.id,pinned:p.pinned});
    toast(T(p.pinned?'Fijado arriba':'Quitado de fijados'), ()=>{
      p.pinned=!p.pinned; renderAll(); native('update',{id:p.id,pinned:p.pinned});
    });
  });
  if(p.hidden) mk(T('Volver a recientes'),async()=>{p.hidden=false; await native('update',{id:p.id,hidden:false}); await refresh();});
  else mk(T('Quitar de recientes'),()=>{
    p.hidden=true; renderAll(); native('update',{id:p.id,hidden:true});
    toast(T('Quitado de recientes'), ()=>{
      p.hidden=false; renderAll(); native('update',{id:p.id,hidden:false});
    });
  });
  mk(T(p.archived?'Desarchivar':'Archivar'),()=>{
    p.archived=!p.archived; renderAll(); native('update',{id:p.id,archived:p.archived});
    toast(T(p.archived?'Archivado':'Restaurado'), ()=>{
      p.archived=!p.archived; renderAll(); native('update',{id:p.id,archived:p.archived});
    });
  });
  mk(T('Mover a carpeta…'),async()=>{
    const prev=p.folder;                       // se guarda ANTES de mover
    const f=await askFolder(prev);
    if(!f || f===prev) return;
    p.folder=f; renderAll();
    native('update',{id:p.id,folder:f});
    if(!(DB.folders||[]).includes(f)){ DB.folders=(DB.folders||[]).concat([f]); native('addFolder',{name:f}); renderRail(); }
    toast(T('Movido a «{f}»',{f:folderLabel(f)}), ()=>{
      p.folder=prev; renderAll(); native('update',{id:p.id,folder:prev});
    });
  });
  m.appendChild(el('div','sep'));
  mk(T('Quitar del launcher…'),async()=>{
    const yes=await askConfirm(T('Quitar del launcher'),
      T('¿Quitar «{name}» del launcher?\n\nEl .rpp no se toca: sigue en su carpeta y no vuelve a la lista al abrirlo desde fuera.',{name:p.name}),
      T('Quitar'), true);
    if(yes){
      const snap=JSON.parse(JSON.stringify(p));
      native('forget',{id:p.id});
      DB.projects=(DB.projects||[]).filter(x=>x.id!==p.id);
      state.selected=null; renderAll();
      toast(T('Quitado del launcher'), ()=>{
        native('restoreProject',{project:snap});
        DB.projects=DB.projects.concat([snap]); renderAll();
        toast(T('Devuelto al launcher'));
      });
    }
  },'is-danger');
  m.classList.add('is-on');
  const r=anchor.getBoundingClientRect();
  placeMenu(m, r.right, r.bottom+4, true);
}
function closeMenu(){ $('#menu').classList.remove('is-on'); }

// La barra de estado está dentro de la página: si el menú se limita al
// viewport, la tapa. El límite inferior es el borde superior de la barra.
function menuLimits(){
  const sb=document.querySelector('.rk-statusbar');
  const maxY=(sb ? sb.getBoundingClientRect().top : innerHeight) - 8;
  return {maxX: innerWidth-8, maxY: Math.max(160, maxY), minY: 8};
}
function placeMenu(m, x, y, alignRight){
  const {maxX, maxY, minY}=menuLimits();
  m.style.maxHeight=Math.max(140, maxY-minY)+'px';
  m.style.overflow='auto';
  const w=m.offsetWidth, h=Math.min(m.offsetHeight, maxY-minY);
  let left = alignRight ? x-w : x;           // alignRight: x es el borde derecho del ancla
  if(left+w>maxX) left=maxX-w;               // que no se salga por la derecha
  if(left<8) left=8;
  let top = y;
  if(top+h>maxY) top=y-h;                    // si no entra abajo, se abre hacia arriba
  if(top<minY) top=minY;
  if(top+h>maxY) top=Math.max(minY, maxY-h);
  m.style.left=left+'px'; m.style.top=top+'px';
}
document.addEventListener('click',closeMenu);

/* =========================================================
   Toast / estado
   ========================================================= */
let toastTimer=null;
/* Toast con acción opcional: el botón vive 5 s y hay una barra que se agota.
   Al pasar el mouse por encima el tiempo se detiene, para no perder el deshacer. */
let toastUndo=null, toastDeadline=0;
function toastHide(){
  clearTimeout(toastTimer);
  const box=$('#toast'); if(box) box.hidden=true;
  toastUndo=null;
}
function toast(msg, undo){
  const box=$('#toast'), act=$('#toastAct'), bar=$('#toastBar');
  $('#toastMsg').textContent=msg;
  toastUndo=(typeof undo==='function')?undo:null;
  act.hidden=!toastUndo;
  const ms = toastUndo ? 5000 : 2600;
  box.hidden=false;
  clearTimeout(toastTimer);
  toastDeadline=Date.now()+ms;
  box.style.setProperty('--toast-ms', ms+'ms');
  if(bar){
    bar.classList.remove('is-on');
    void bar.offsetWidth;                       // reinicia la animación
    bar.classList.add('is-on');
  }
  toastTimer=setTimeout(toastHide, ms);
}
(function(){
  const box=$('#toast');
  if(!box) return;
  box.addEventListener('mouseenter',()=>{ if(toastUndo) clearTimeout(toastTimer); });
  box.addEventListener('mouseleave',()=>{
    if(!toastUndo) return;
    const left=Math.max(700, toastDeadline-Date.now());
    clearTimeout(toastTimer); toastTimer=setTimeout(toastHide,left);
  });
  $('#toastAct').onclick=()=>{
    const fn=toastUndo;
    toastHide();
    if(fn) fn();
  };
})();

async function refresh(){
  const data=await native('list');
  if(data && data.projects){ DB=data; if(!state.selected && DB.projects.length) state.selected=DB.projects[0].id; }
  renderAll();
}

}

function getPref(k, def){ try { return localStorage.getItem('sel.'+k) || def; } catch(e){ return def; } }
function setPref(k, v){ try { localStorage.setItem('sel.'+k, v); } catch(e){} }

function applyPrefs(){
  // La app inyecta el tema/acento guardados ANTES del primer pintado; si ya
  // vienen puestos, se respetan para no provocar un cambio de color visible.
  const ds = document.documentElement.dataset;
  const theme = ds.theme || getPref('theme','dark');
  const accent = ds.accent || getPref('accent','reapertips');
  LANG = (ds.lang === 'en' || ds.lang === 'es') ? ds.lang : (getPref('lang','es'));
  if(LANG !== 'en') LANG = 'es';
  ds.theme = theme; ds.accent = accent; ds.lang = LANG;
  // localStorage es la fuente mientras la app no tenga prefs.json; cuando la
  // inyección ya trae los valores, ambos coinciden y esto es un no-op.
  if (getPref('theme','') !== theme) setPref('theme', theme);
  if (getPref('accent','') !== accent) setPref('accent', accent);
  setPref('lang', LANG);
  applyStaticI18n();
  native('prefs', {theme: theme, accent: accent, lang: LANG});
  const bt = $('#btnTheme'); if(bt) bt.innerHTML = theme === 'dark' ? SVG_SUN : SVG_MOON;
  const ba = $('#btnAccent');
  if(ba){
    const a = ACCENTS.find(x=>x.id===accent) || ACCENTS[0];
    ba.innerHTML = SVG_PALETTE;
    ba.style.color = a.swatch;
  }
  const bg = getComputedStyle(document.documentElement).getPropertyValue('--rk-bg-1').trim();
  if(bg) native('chrome', {color: bg});
}

function openMenuAt(items, x, y){
  const m=$('#menu'); m.innerHTML='';
  items.forEach(it=>{
    if(it.sep){ m.appendChild(el('div','sep')); return; }
    if(it.header){ const h=el('div','hd',it.header); m.appendChild(h); return; }
    const b=el('button','it'+(it.danger?' is-danger':''));
    if(it.swatch){ const s=el('i','sw'); s.style.background=it.swatch; b.appendChild(s); }
    b.appendChild(el('span','ml',it.label));
    if(it.checked) b.appendChild(el('span','chk','✓'));
    b.onclick=async ev=>{ ev.stopPropagation(); closeMenu(); if(it.run) await it.run(); };
    m.appendChild(b);
  });
  m.classList.add('is-on');
  m.style.left='0px'; m.style.top='0px';
  placeMenu(m, x, y, false);
}

function projectMenu(p){
  const items=[
    {label:T('Abrir en REAPER'), run:()=>{ native('open',{path:p.path}); setTimeout(refresh, 1200); }},
    {label:T('Abrir con FX offline (recovery mode)'), run:()=>openWith(p,'fxoffline')},
    {label:T('Abrir y traer los FX online'), run:()=>openWith(p,'fxoffline-online')},
    {label:T('Mostrar en Finder'), run:()=>native('reveal',{path:p.path})},
    ...(p.exists===false ? [{label:T('Ubicar de nuevo…'), run:async()=>{
      await native('relocate',{id:p.id});
      await refresh();
    }}] : []),
    {sep:true},
    {label:T(p.pinned?'Quitar de fijados':'Fijar arriba'), run:()=>{
      p.pinned=!p.pinned; renderAll(); native('update',{id:p.id,pinned:p.pinned});
      toast(T(p.pinned?'Fijado arriba':'Quitado de fijados'), ()=>{ p.pinned=!p.pinned; renderAll(); native('update',{id:p.id,pinned:p.pinned}); });
    }},
    {label:T(p.archived?'Desarchivar':'Archivar'), run:()=>{
      p.archived=!p.archived; renderAll(); native('update',{id:p.id,archived:p.archived});
      toast(T(p.archived?'Archivado':'Restaurado'), ()=>{ p.archived=!p.archived; renderAll(); native('update',{id:p.id,archived:p.archived}); });
    }}
  ];
  if((p.backups||[]).length) items.push({label:T('Ver copias de seguridad')+' ('+p.backups.length+')', run:()=>{ if(state.expanded.has(p.id)) state.expanded.delete(p.id); else state.expanded.add(p.id); renderTable(); }});
  items.push({sep:true});
  items.push({label:T('Mover a carpeta…'), run:async()=>{
    const prev=p.folder;                       // se guarda ANTES de mover
    const f=await askFolder(prev);
    if(!f || f===prev) return;
    p.folder=f; renderAll();
    native('update',{id:p.id,folder:f});
    if(!(DB.folders||[]).includes(f)){ DB.folders=(DB.folders||[]).concat([f]); native('addFolder',{name:f}); renderRail(); }
    toast(T('Movido a «{f}»',{f:folderLabel(f)}), ()=>{ p.folder=prev; renderAll(); native('update',{id:p.id,folder:prev}); });
  }});
  items.push({label:T(p.hidden?'Volver a recientes':'Quitar de recientes'), run:()=>{
    p.hidden=!p.hidden; renderAll();
    native('update',{id:p.id,hidden:p.hidden});
    toast(T(p.hidden?'Quitado de recientes':'Devuelto a recientes'),
          ()=>{ p.hidden=!p.hidden; renderAll(); native('update',{id:p.id,hidden:p.hidden}); });
  }});
  items.push({sep:true});
  if(DB.reaperRunning){ items.push({sep:true}); items.push({label:T('Traer todos los FX online'), run:()=>native('fxonline')}); }
  items.push({label:T('Quitar del launcher…'), danger:true, run:async()=>{
    const yes=await askConfirm(T('Quitar del launcher'),
      T('¿Quitar «{name}» del launcher?\n\nEl .rpp no se toca: sigue en su carpeta y no vuelve a la lista al abrirlo desde fuera.',{name:p.name}),
      T('Quitar'), true);
    if(!yes) return;
    const snap=JSON.parse(JSON.stringify(p));
    native('forget',{id:p.id});
    DB.projects=(DB.projects||[]).filter(x=>x.id!==p.id);
    state.selected=null; renderAll();
    toast(T('Quitado del launcher'), ()=>{
      native('restoreProject',{project:snap});
      DB.projects=DB.projects.concat([snap]); renderAll();
      toast(T('Devuelto al launcher'));
    });
  }});
  items.push({label:T('Eliminar proyecto…'), danger:true, run:()=>deleteProject(p)});
  return items;
}

function folderMenu(name){
  return [
    {header:folderLabel(name)},
    {label:T('Abrir carpeta'), run:()=>{state.view={kind:'folder',value:name}; renderAll();}},
    {sep:true},
    {label:T('Renombrar…'), run:()=>openFolderSheet(name,'rename')},
    {label:T('Color e icono…'), run:()=>openFolderSheet(name,'style')},
    {sep:true},
    {label:T('Nueva carpeta…'), run:createFolder},
    {label:T('Eliminar carpeta'), danger:true, run:()=>deleteFolder(name)}
  ];
}

/* ---------------------------------------------------------
   Diálogos propios
   WKWebView bloquea confirm() y prompt() del navegador (el
   UIDelegate no implementa esos paneles), así que devolvían
   false/null sin mostrar nada. Todo pasa por esta hoja.
   --------------------------------------------------------- */
function askSheet(cfg){
  return new Promise(resolve=>{
    const scrim=$('#askScrim'), wrap=$('#askWrap'), body=$('#askBody');
    $('#askTitle').textContent = cfg.title || '';
    const msg=$('#askMsg'); msg.textContent = cfg.msg || '';
    body.innerHTML='';
    let inputEl=null;

    if(cfg.list && cfg.list.length){
      const list=document.createElement('div'); list.className='asklist';
      cfg.list.forEach(name=>{
        const b=document.createElement('button');
        b.className='it'+(name===cfg.value?' is-on':'');
        b.textContent=folderLabel(name);
        b.onclick=()=>finish(name);
        list.appendChild(b);
      });
      body.appendChild(list);
    }
    if(cfg.input!==false){
      inputEl=document.createElement('input');
      inputEl.className='rk-input';
      inputEl.value=cfg.value||'';
      inputEl.placeholder=cfg.placeholder||'';
      body.appendChild(inputEl);
    }

    const ok=$('#askOk'), cancel=$('#askCancel');
    ok.textContent=cfg.okLabel||T('Aceptar');
    ok.className='rk-btn '+(cfg.danger?'rk-btn--danger':'rk-btn--primary');
    scrim.classList.add('is-on'); wrap.classList.add('is-on');

    function finish(v){
      scrim.classList.remove('is-on'); wrap.classList.remove('is-on');
      ok.onclick=cancel.onclick=scrim.onclick=null;
      document.removeEventListener('keydown',onKey);
      resolve(v);
    }
    function onKey(e){
      if(e.key==='Escape'){ e.preventDefault(); finish(null); }
      else if(e.key==='Enter'){ e.preventDefault(); finish(inputEl ? (inputEl.value.trim()||null) : true); }
    }
    document.addEventListener('keydown',onKey);
    ok.onclick=()=>finish(inputEl ? (inputEl.value.trim()||null) : true);
    cancel.onclick=()=>finish(null);
    scrim.onclick=()=>finish(null);
    setTimeout(()=>{ if(inputEl){ inputEl.focus(); inputEl.select(); } else ok.focus(); },60);
  });
}
const askConfirm=(title,msg,okLabel,danger)=>askSheet({title,msg,okLabel:okLabel||T('Aceptar'),danger:!!danger,input:false});
const askText=(title,msg,value,okLabel,ph)=>askSheet({title,msg,value,okLabel,placeholder:ph});
const askFolder=cur=>askSheet({title:T('Mover a carpeta'),msg:T('Elige una carpeta o escribe una nueva:'),
                               list:(DB.folders||[]).slice(),value:cur,okLabel:T('Mover')});

async function deleteProject(p){
  const ok=await askConfirm(
    LANG==='es' ? 'Eliminar proyecto' : 'Delete project',
    LANG==='es'
      ? '¿Eliminar «'+p.name+'»?\n\nEl archivo se mueve a la Papelera:\n'+p.path+'\n\nEsta acción borra el proyecto del disco y del launcher.'
      : 'Delete "'+p.name+'"?\n\nThe file goes to the Trash:\n'+p.path+'\n\nThis removes the project from disk and from the launcher.',
    LANG==='es' ? 'Eliminar' : 'Delete', true);
  if(!ok) return;
  const r=await native('delete',{id:p.id});
  if(r && r.ok===false){ toast(T('No se pudo eliminar: {e}',{e:(r.error||T('error desconocido'))})); return; }
  const snap=JSON.parse(JSON.stringify(p));
  const trashPath = r && r.trashPath ? r.trashPath : '';
  state.selected=null;
  DB.projects=(DB.projects||[]).filter(x=>x.id!==p.id);
  renderAll();
  toast(T('Proyecto eliminado'), ()=>{
    native('undelete',{path:snap.path, trashPath, project:snap}).then(res=>{
      if(res && res.ok===false){ toast(T('No se pudo deshacer: {e}',{e:(res.error||'?')})); return; }
      DB.projects=DB.projects.concat([snap]); renderAll();
      toast(T('Proyecto restaurado'));
    });
  });
}

async function createFolder(){
  const n=await askText(T('Nueva carpeta'), T('Es virtual: no mueve archivos.'),
                        '', T('Crear'), T('Nombre de la carpeta'));
  if(!n) return;
  native('addFolder',{name:n});
  await refresh();
}

async function deleteFolder(name){
  const msg = LANG==='es'
    ? '¿Eliminar la carpeta «'+folderLabel(name)+'»?\n\nLos proyectos no se borran: pasan a «Sin carpeta».'
    : 'Delete the folder "'+folderLabel(name)+'"?\n\nProjects are not deleted: they move to "No folder".';
  if(!(await askConfirm(LANG==='es'?'Eliminar carpeta':'Delete folder', msg, LANG==='es'?'Eliminar':'Delete', true))){
    return;
  }
  await native('deleteFolder',{name});
  if(state.view.kind==='folder' && state.view.value===name) state.view={kind:'recent'};
  await refresh();
  toast(T('Carpeta eliminada · los proyectos quedaron en «Sin carpeta»'));
}

/* =========================================================
   Hoja de carpeta (renombrar / color / icono)
   ========================================================= */
let sheetCurrent=null;
function closeSheet(){ const s=$('#sheetWrap'); if(s) s.remove(); sheetCurrent=null; }

async function openFolderSheet(name, focus){
  closeSheet();
  sheetCurrent=name;
  const meta=(DB.folderMeta||{})[name]||{};
  let selColor=meta.color||'';
  let selIcon=meta.icon||'folder';
  const wrap=el('div','modal-wrap is-on');
  wrap.id='sheetWrap';
  wrap.onclick=e=>{ if(e.target===wrap) closeSheet(); };
  const box=el('div','rk-modal');
  box.style.width='420px';
  const head=el('div','rk-modal-head');
  head.appendChild(el('span','rk-section', T(focus==='rename'?'Renombrar carpeta':'Carpeta')));
  head.appendChild(el('span','rk-meta', folderLabel(name)));
  box.appendChild(head);

  const body=el('div','rk-modal-body');
  const f1=el('label','rk-field');
  f1.appendChild(el('span','rk-field-label',T('Nombre')));
  const inp=el('input','rk-input'); inp.value=name; f1.appendChild(inp); body.appendChild(f1);

  body.appendChild(el('div','rk-field-label',T('Color')));
  const cw=el('div','swrow');
  FOLDER_COLOR_LIST.forEach(c=>{
    const b=el('button','swbtn'+(selColor===c?' is-on':''));
    b.style.background=c; b.title=c;
    b.onclick=()=>{ selColor=c; [...cw.children].forEach(x=>x.classList.remove('is-on')); b.classList.add('is-on'); };
    cw.appendChild(b);
  });
  const bNone=el('button','swbtn swbtn--none'+(selColor===''?' is-on':''));
  bNone.textContent='—'; bNone.title=T('Sin color');
  bNone.onclick=()=>{ selColor=''; [...cw.children].forEach(x=>x.classList.remove('is-on')); bNone.classList.add('is-on'); };
  cw.appendChild(bNone);
  body.appendChild(cw);

  body.appendChild(el('div','rk-field-label',T('Icono')));
  const iw=el('div','icrow');
  FOLDER_ICON_LIST.forEach(ic=>{
    const b=el('button','icbtn'+(selIcon===ic?' is-on':''));
    b.innerHTML=''; b.appendChild(icon(FOLDER_ICONS[ic]));
    b.onclick=()=>{ selIcon=ic; [...iw.children].forEach(x=>x.classList.remove('is-on')); b.classList.add('is-on'); };
    iw.appendChild(b);
  });
  body.appendChild(iw);
  box.appendChild(body);

  const foot=el('div','rk-modal-foot');
  const cancel=el('button','rk-btn rk-btn--quiet',T('Cancelar'));
  cancel.onclick=closeSheet;
  const save=el('button','rk-btn rk-btn--primary',T('Guardar'));
  save.onclick=async()=>{
    const nuevo=(inp.value||'').trim();
    if(!nuevo){ toast(T('La carpeta necesita un nombre')); return; }
    await native('setFolderMeta',{name, color:selColor, icon:selIcon});
    if(nuevo!==name) await native('renameFolder',{from:name, to:nuevo});
    closeSheet();
    if(state.view.kind==='folder' && state.view.value===name && nuevo!==name){
      state.view={kind:'folder', value:nuevo};
    }
    await refresh();
    toast(T('Carpeta actualizada'));
  };
  foot.appendChild(cancel); foot.appendChild(save);
  box.appendChild(foot);
  wrap.appendChild(box);
  document.body.appendChild(wrap);
  setTimeout(()=>{ inp.focus(); inp.select(); }, 50);
}

/* =========================================================

   ========================================================= */
function accentMenu(x, y){
  const cur=getPref('accent','reapertips');
  openMenuAt([
    {header:T('Esquema de color')},
    ...ACCENTS.map(a=>({
      label:T(a.name), swatch:a.swatch, checked:a.id===cur,
      run:()=>{ setPref('accent',a.id);
                document.documentElement.dataset.accent = a.id;  // applyPrefs lee de aquí
                applyPrefs();
                native('prefs',{theme:getPref('theme','dark'), accent:a.id});
                toast(T('Esquema {name}',{name:T(a.name)})); }
    }))
  ], x, y);
}

/* clic derecho propio: biblioteca y barra lateral */
document.addEventListener('contextmenu', e=>{
  const inInput = /^(INPUT|TEXTAREA)$/.test(e.target.tagName);
  e.preventDefault();
  if(inInput) return;
  const row=e.target.closest('tr.project');
  if(row){ const p=byId(row.dataset.id); if(p){ state.selected=p.id; renderTable(); renderRail(); openMenuAt(projectMenu(p), e.clientX, e.clientY); } return; }
  const folder=e.target.closest('[data-folder]');
  if(folder){ openMenuAt(folderMenu(folder.dataset.folder), e.clientX, e.clientY); return; }
  if(e.target.closest('#content')){
    openMenuAt([
      {label:T('Nuevo proyecto…'), run:openModal},
      {label:T('Abrir archivo…'), run:()=>native('pickProject')},
      {sep:true},
      {label:T('Nueva carpeta…'), run:createFolder}
    ], e.clientX, e.clientY);
  }
});

document.addEventListener('selectstart', e=>{
  if(!/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) e.preventDefault();
});
$('#addTag').onclick=async ()=>{
  const p=byId(state.selected);
  if(!p){ toast(T('Selecciona un proyecto primero')); return; }
  const n=await askText(T('Nueva etiqueta'), ' ', '', T('Agregar'), T('nombre-de-la-etiqueta'));
  if(n){
    const v=n.trim().toLowerCase().replace(/\s+/g,'-');
    if(v && !p.tags.includes(v)){ p.tags.push(v); renderAll(); native('update',{id:p.id,tags:p.tags}); }
  }
};
$('#railToggle').onclick=()=>$('#rail').classList.toggle('is-open');

document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault(); $('#search').focus();}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='n'){e.preventDefault(); openModal();}
  if(e.key==='Escape'){ closeMenu(); closeModal(); if(innerWidth<1080) $('#rail').classList.remove('is-open'); }
  if(e.key==='Enter' && document.activeElement===$('#pName')) $('#mCreate').click();
});
function syncSearchPh(){
  const full = LANG==='es' ? 'Buscar proyecto o etiqueta' : 'Search projects or tags';
  const short = LANG==='es' ? 'Buscar…' : 'Search…';
  $('#search').placeholder = innerWidth<1180 ? short : full;
}
addEventListener('resize',syncSearchPh);

let wasStacked=null;
function syncRail(){
  const stacked=innerWidth<1080;
  $('#railToggle').style.display=stacked?'inline-flex':'none';
  if(stacked!==wasStacked){ $('#rail').classList.toggle('is-open',!stacked); wasStacked=stacked; }
}
addEventListener('resize',syncRail);

setInterval(()=>{ refresh(); }, 30000);

(async function boot(){
  syncRail();
  applyPrefs();          // fija tema, acento e idioma antes del primer pintado
  applyStaticI18n();
  syncSearchPh();
  const data=await native('list');
  if(data && data.projects){
    DB=data;
    state.selected = DB.projects[0] ? DB.projects[0].id : null;
  }
  renderAll();
  // avisa a la app que la UI ya está pintada: recién ahí aparece la ventana
  native('ready');
})();

function slimMenu(p){
  const items = [
    {label:T('Abrir'), run:()=>native('open',{path:p.path})},
    {label:T('Abrir con FX offline'), run:()=>openWith(p,'fxoffline')},
    {label:T('Abrir y traer FX online'), run:()=>openWith(p,'fxoffline-online')},
    {sep:true},
    {label:T('Mostrar en Finder'), run:()=>native('reveal',{path:p.path})}
  ];
  if(DB.reaperRunning){
    items.push({sep:true});
    items.push({label:T('Traer FX online'), run:()=>native('fxonline')});
  }
  return items;
}

function slimRow(p){
  const row = el('div','slim-row'); row.tabIndex = 0;
  row.onclick = () => native('open',{path:p.path});
  row.oncontextmenu = e => { e.preventDefault(); openMenuAt(slimMenu(p), e.clientX, e.clientY); };
  row.onkeydown = e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); native('open',{path:p.path}); } };

  const slot = el('span','slot');
  const dot = el('span','dot');
  dot.style.background = (DB.folderMeta && DB.folderMeta[p.folder] && DB.folderMeta[p.folder].color) || 'var(--rk-text-3)';
  const pin = el('button','pin'); pin.innerHTML = p.pinned ? SVG_PIN_ON : SVG_PIN;
  if(p.pinned) pin.classList.add('is-on');
  pin.title = T(p.pinned ? 'Quitar de fijados' : 'Fijar arriba');
  pin.onclick = ev => {
    ev.stopPropagation();
    p.pinned = !p.pinned;
    renderSlim();
    native('update',{id:p.id, pinned:p.pinned});
  };
  slot.appendChild(dot); slot.appendChild(pin);

  const txt = el('span','txt');
  const nm = el('span','nm');
  nm.appendChild(el('span','nmt', p.name));
  const go = el('span','go'); go.innerHTML = SVG_GO;
  nm.appendChild(go);
  txt.appendChild(nm);
  const meta = [p.folder ? folderLabel(p.folder) : '', ago(p.lastOpened), (p.regions ? p.regions + ' ' + (LANG==='es'?'reg.':'reg.') : '')].filter(Boolean).join(' · ');
  txt.appendChild(el('span','mt', meta));

  const x = el('button','x'); x.innerHTML = SVG_X;
  x.title = T('Quitar de recientes');
  x.onclick = ev => {
    ev.stopPropagation();
    p.hidden = true;
    renderSlim();
    native('update',{id:p.id, hidden:true});
    toast(T('Quitado de recientes'), ()=>{
      p.hidden=false; renderSlim(); native('update',{id:p.id, hidden:false});
    });
  };

  row.appendChild(slot); row.appendChild(txt); row.appendChild(x);
  return row;
}

function renderSlim(){
  const list = $('#slimList'); if(!list) return;
  const live = DB.projects.filter(p => !p.archived && !p.hidden);
  const by = (a,b) => (b.lastOpened||0) - (a.lastOpened||0);
  const pinned = live.filter(p => p.pinned).sort(by);
  const rest = live.filter(p => !p.pinned).sort(by);
  list.innerHTML = '';
  if(pinned.length){
    list.appendChild(el('div','slim-label', T('FIJADOS')));
    pinned.forEach(p => list.appendChild(slimRow(p)));
  }
  if(rest.length){
    list.appendChild(el('div','slim-label', T('RECIENTES')));
    rest.forEach(p => list.appendChild(slimRow(p)));
  }
  const c = $('#slimCount');
  if(c) c.textContent = live.length + ' ' + T('proyectos');
  const led = $('#slimLed');
  if(led) led.classList.toggle('on', !!DB.reaperRunning);
}

function setSlim(on, persist){
  on = !!on;
  document.body.classList.toggle('is-slim', on);
  if(on) renderSlim();
  // El modo slim no se persiste: cada arranque abre en full, para que el
  // launcher no aparezca angosto sin que nadie lo haya pedido.
  try { native('slim', {on: on}); } catch(e){}
}

if($('#btnSlim')){
  $('#btnSlim').innerHTML = SVG_SLIM;
  $('#btnSlim').onclick = () => setSlim(true, true);
}
if($('#btnFull2')) $('#btnFull2').onclick = () => setSlim(false, true);

// El nativo inyecta data-slim cuando la última sesión quedó en modo slim.
if(document.documentElement.dataset.slim === '1') setSlim(true, false);
